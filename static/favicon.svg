<g fill="none" stroke="#c9c6bf" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter" shape-rendering="crispEdges">
<path d="M3.5 12.5V9.5H5.5V6.5H7.5V3.5H10.5V7.5H12.5V12.5"/>
<path d="M2.5 12.5H13.5"/>
</g>
</svg>
