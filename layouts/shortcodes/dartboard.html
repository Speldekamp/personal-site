{{- $css := resources.Get "css/dartboard.css" | minify | fingerprint -}}
{{- $js := resources.Get "js/dartboard.js" | minify | fingerprint -}}

<div class="dartboard"></div>
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
