baseURL: "https://speldekamp.github.io/personal-site/"
title: "Daniël's Personal Website"
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Papers
          url: papers/
          weight: 1
          params:
            icon: papers
        - name: Data
          url: data/
          weight: 2
          params:
            icon: data
        - name: Courses
          url: courses/
          weight: 3
          params:
            icon: courses
        - name: Code
          url: code/
          weight: 4
          params:
            icon: code
        - name: Blog
          url: blog/
          weight: 5
          params:
            icon: blog
        - name: About
          url: about/
          weight: 6
          params:
            icon: about

params:
    description: "Research papers, data, courses, code and writing by [Your Name]."
    author: "[Your Name]"
    DateFormat: January 2006
    defaultTheme: dark
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: [papers, data, courses, code, blog]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: "Daniël Speldekamp"
          role: "Assistant Professor, FEBRI Fellow & External Relations Coordinator · Faculty of Economics and Business · University of Groningen"
          subtitle: "Specializing in businesses & their environments, innovation, \"exceedingly vague algorithms\" such as used in QCA (thanks, reviewer), and breaking stuff. A believer that universities can do more for students, businesses, and society."
          # To add a photo: put photo.jpg in static/ and uncomment the next line.
          imageUrl: photo.svg
          imageUrlLight: photo-light.svg   # same drawing for the light theme
          imageTitle: "Line drawing of a city skyline"
          imageWidth: 128
          imageHeight: 128
          # Front-page icon links. icon must be one of:
          # papers, data, courses, code, blog, about
          buttons:
            - name: Papers
              url: papers/
              icon: papers
            - name: Data
              url: data/
              icon: data
            - name: Courses
              url: courses/
              icon: courses
            - name: Code
              url: code/
              icon: code
            - name: Blog
              url: blog/
              icon: blog
            - name: About
              url: about/
              icon: about

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      hide: true   # no site name or icon in the header

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: monokai
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
